services:

  # ── AMP ───────────────────────────────────────────────────────────────────────
  # Game server management panel. Manages game servers via AMP.
  # Web UI at http://<host-ip>:8080
  amp:
    image: mitchtalmadge/amp-dockerized:latest
    container_name: amp
    mac_address: ${AMP_MAC}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USERNAME=${AMP_USERNAME}
      - PASSWORD=${AMP_PASSWORD}
      - LICENCE=${AMP_LICENCE}
      - MODULE=ADS
    volumes:
      - ${DATA_DIR}/ampdata:/home/amp/.ampdata
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
      - "9876:9876/udp"
      - "9877:9877/udp"
      - "25575:25575/tcp"
      # Add port mappings for your game servers here, e.g.:
      # - "${GAME_PORT_1}:${GAME_PORT_1}/udp"
      # - "${GAME_PORT_2}:${GAME_PORT_2}/udp"
      # - "25575:25575/tcp"   # RCON (if needed)
    restart: unless-stopped

  # ── Wolf ─────────────────────────────────────────────────────────────────────
  # Moonlight streaming host. Streams containerised desktops/games to Moonlight
  # clients. Config at ${DATA_DIR}/wolf-config/cfg/config.toml
  # Pairing endpoint at http://<host-ip>:47989
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable
    container_name: wolf
    network_mode: host
    environment:
      - XDG_RUNTIME_DIR=/tmp/sockets
      - GOW_RUNTIME_DIR=/tmp/sockets
      - HOST_APPS_STATE_FOLDER=/etc/wolf
      - PULSE_SERVER=unix:/tmp/sockets/pulse-socket
    volumes:
      - ${DATA_DIR}/wolf-config/cfg:/etc/wolf:rw
      - /tmp/sockets:/tmp/sockets:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /var/run/wolf:/var/run/wolf:rw
      - /dev/:/dev/:rw
      - /run/udev/data:/run/udev/data:rw
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
    restart: unless-stopped

  # ── Wolf WebRTC Sidecar ───────────────────────────────────────────────────────
  # Re-streams Wolf sessions to browsers via WebRTC (view-only co-watching;
  # Moonlight stays the interactive path).
  # Reads encoded frames from shm sockets in /tmp/sockets that Wolf writes once
  # config.toml is patched:  bash wolf-webrtc-sidecar/apply-wolf-tap.sh
  # Without that patch the sidecar simply reports no sessions.
  # Browser client:       http://<host-ip>:8088/client
  # Ingest/peer status:   http://<host-ip>:8088/status
  # WebSocket signalling: ws://<host-ip>:8089/<session_id>
  wolf-webrtc:
    build:
      context: ./wolf-webrtc-sidecar
      dockerfile: Dockerfile
    container_name: wolf-webrtc
    network_mode: host
    environment:
      - SIDECAR_HTTP_PORT=8088
      - SIDECAR_WS_PORT=8089
      - STUN_SERVER=stun://stun.l.google.com:19302
      - TAP_DIR=/tmp/sockets
    volumes:
      - /tmp/sockets:/tmp/sockets:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    depends_on:
      - wolf

  # ── Portal ────────────────────────────────────────────────────────────────────
  # nginx serving the GameStack portal UI.
  # Moved to port 8090 — port 80 is owned by lancache-monolithic (required for
  # Steam CDN HTTP interception). Update bookmarks accordingly.
  # Access: http://<host-ip>:8090/
  portal:
    image: nginx:alpine
    container_name: portal
    ports:
      - "8090:80"
    volumes:
      - ${DATA_DIR}/portal/html:/usr/share/nginx/html:ro
      - ${DATA_DIR}/portal/docs:/usr/share/nginx/docs:ro
      - ${DATA_DIR}/portal/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - amp
      - wolf


  # ── LanCache Monolithic ───────────────────────────────────────────────────────
  # Transparent caching proxy for Steam, Epic, GOG, Blizzard and other CDNs.
  # Must own port 80 — Steam CDN traffic is HTTP on port 80 and cannot be
  # redirected to a non-standard port.
  # Cache lives at ${CACHE_DIR} — allocate generously (500GB+ recommended).
  # USE_GENERIC_CACHE=true enables Workshop/mod caching via the generic cache.
  # Logs: docker logs lancache-monolithic
  lancache-monolithic:
    image: lancachenet/monolithic:latest
    container_name: lancache-monolithic
    environment:
      - TZ=${TZ}
      - CACHE_MEM_SIZE=${CACHE_MEM_SIZE:-500m}
      - CACHE_DISK_SIZE=${CACHE_DISK_SIZE:-500000m}
      - CACHE_MAX_AGE=${CACHE_MAX_AGE:-3650d}
      - USE_GENERIC_CACHE=true
      - UPSTREAM_DNS=${UPSTREAM_DNS:-1.1.1.1}
    volumes:
      - ${CACHE_DIR}/data:/data/cache
      - ${CACHE_DIR}/logs:/data/logs
    ports:
      - "80:80"
    restart: unless-stopped

  # ── LanCache DNS ─────────────────────────────────────────────────────────────
  # DNS server that resolves Steam/Epic/GOG CDN hostnames to the host IP so
  # traffic is intercepted by lancache-monolithic.
  # Point client DNS to HOST_IP (YOUR_HOST_IP) to use the cache.
  # LANCACHE_IP must match your host LAN IP.
  # Logs: docker logs lancache-dns
  lancache-dns:
    image: lancachenet/lancache-dns:latest
    container_name: lancache-dns
    environment:
      - TZ=${TZ}
      - LANCACHE_IP=${HOST_IP}
      - USE_GENERIC_CACHE=true
      - UPSTREAM_DNS=${UPSTREAM_DNS:-1.1.1.1}
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped
    depends_on:
      - lancache-monolithic
networks:
  default:
    driver: bridge
